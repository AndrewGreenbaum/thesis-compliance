# Reusable workflow for checking thesis PDFs
# Users can call this from their own repos
#
# Example usage in user's repo:
#
# name: Check Thesis Formatting
# on: [push, pull_request]
# jobs:
#   check:
#     uses: AndrewGreenbaum/thesis-pdf-format-checker/.github/workflows/thesis-check.yml@main
#     with:
#       pdf-path: thesis.pdf
#       spec: rackham

name: Thesis PDF Format Checker

on:
  workflow_call:
    inputs:
      pdf-path:
        description: 'Path to the thesis PDF file'
        required: true
        type: string
      spec:
        description: 'Style specification to check against (e.g., rackham, stanford, mit)'
        required: false
        type: string
        default: 'rackham'
      pages:
        description: 'Page range to check (e.g., "1-10,20")'
        required: false
        type: string
        default: ''
      strict:
        description: 'Fail on warnings as well as errors'
        required: false
        type: boolean
        default: false
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'

jobs:
  check-thesis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user's repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Checkout checker source
        uses: actions/checkout@v4
        with:
          repository: AndrewGreenbaum/thesis-pdf-format-checker
          ref: main
          path: .thesis-checker

      - name: Check thesis formatting
        uses: ./.thesis-checker
        with:
          python-version: ${{ inputs.python-version }}
          pdf-path: ${{ inputs.pdf-path }}
          spec: ${{ inputs.spec }}
          pages: ${{ inputs.pages }}
          strict: ${{ inputs.strict }}
          format: json

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-compliance-report
          path: ${{ runner.temp }}/thesis-results.json
